<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday! 🎂</title>
<style>
  :root{ --pink:#e8547f; --soft:#ffe3ec; --paper:#f7f1ea; --red:#d9432f; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:linear-gradient(160deg,#ffe9f1 0%,#ffd1e0 45%,#f9c3d6 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
  }

  /* ---------- floating background ---------- */
  .float-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .float-bg span{position:absolute;bottom:-60px;font-size:26px;opacity:.55;animation:up linear infinite}
  @keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:30}

  /* ---------- the book ---------- */
  .scene{position:relative;z-index:2;perspective:2200px;
    width:min(92vw, calc(86vh * 0.7094));
    aspect-ratio:1240/1748;
    animation:floaty 5s ease-in-out infinite;}
  @keyframes floaty{50%{transform:translateY(-8px)}}
  .book{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.6,.05,.2,1);
    filter:drop-shadow(0 22px 28px rgba(120,30,60,.35))}
  .book.opened{transform:translateX(0)}

  .page,.leaf{position:absolute;inset:0}
  .page{z-index:1;border-radius:4px 10px 10px 4px;overflow:hidden;background:var(--paper)}
  .leaf{transform-origin:left center;transform-style:preserve-3d;
    transition:transform 1.5s cubic-bezier(.55,.05,.25,1), opacity .2s;}
  #leaf2{z-index:2}
  #leaf1{z-index:3}
  .leaf.flipped{transform:rotateY(-178deg);opacity:0;
    transition:transform 1.5s cubic-bezier(.55,.05,.25,1), opacity .35s 1.15s}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:4px 10px 10px 4px;overflow:hidden;background:var(--paper)}
  .face img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
  .face.back{transform:rotateY(180deg);border-radius:10px 4px 4px 10px;
    background:
      radial-gradient(circle at 30% 20%,#fff0f5 0,transparent 55%),
      linear-gradient(135deg,#fde4ec,#f9cfdd);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#c94a74;
    font-family:'Brush Script MT','Segoe Script',cursive;font-size:clamp(1.3rem,4.5vw,2.2rem);text-align:center}
  .face.back .h{font-size:3rem;animation:beat 1.2s infinite}
  @keyframes beat{50%{transform:scale(1.2)}}
  /* spine shading */
  .face::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 7%)}
  .face.back::after{background:linear-gradient(270deg,rgba(0,0,0,.18),rgba(0,0,0,0) 7%)}

  /* ---------- hotspots ---------- */
  .hot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:5}
  /* cover button over "OPEN WITH HAPPINESS" pill */
  #openBtn{left:17.5%;top:86%;width:67.5%;height:7%;border-radius:14px;
    animation:pulseBtn 1.8s infinite}
  #openBtn::before{content:"";position:absolute;inset:0;border-radius:14px;
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);
    background-size:250% 100%;animation:shine 2.4s infinite}
  @keyframes pulseBtn{0%{box-shadow:0 0 0 0 rgba(232,84,127,.55)}70%{box-shadow:0 0 0 16px rgba(232,84,127,0)}100%{box-shadow:0 0 0 0 rgba(232,84,127,0)}}
  @keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
  /* gift box on page 2 */
  #giftBtn{left:71%;top:72%;width:27%;height:23%;border-radius:50%;animation:giftWiggle 2.2s infinite}
  #giftBtn::after{content:"Tap me 🎁";position:absolute;left:50%;top:-18px;transform:translateX(-50%);white-space:nowrap;
    background:#fff;color:var(--pink);font-size:clamp(.7rem,2.4vw,.95rem);font-weight:700;padding:4px 10px;border-radius:999px;
    box-shadow:0 4px 10px rgba(0,0,0,.18);animation:bob 1.4s ease-in-out infinite}
  @keyframes giftWiggle{0%,80%,100%{transform:rotate(0) scale(1)}84%{transform:rotate(-8deg) scale(1.06)}88%{transform:rotate(8deg) scale(1.06)}92%{transform:rotate(-6deg)}96%{transform:rotate(6deg)}}
  @keyframes bob{50%{transform:translate(-50%,-6px)}}
  #giftBtn:focus-visible,#openBtn:focus-visible{outline:3px dashed var(--pink)}

  /* page-2 sparkles */
  .sparkle{position:absolute;pointer-events:none;font-size:clamp(14px,3.5vw,24px);animation:twinkle 2s infinite}
  @keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:0}50%{transform:scale(1.1) rotate(25deg);opacity:1}}

  /* ---------- controls ---------- */
  .ctrl{position:fixed;z-index:20;border:0;cursor:pointer;border-radius:999px;font-weight:700;
    background:#fff;color:var(--pink);box-shadow:0 6px 16px rgba(120,30,60,.25);transition:transform .15s,opacity .4s}
  .ctrl:hover{transform:scale(1.07)}
  #music{top:14px;right:14px;width:46px;height:46px;font-size:1.3rem;display:none}
  #replay{bottom:18px;left:50%;transform:translateX(-50%);padding:11px 22px;font-size:1rem;display:none}
  #replay:hover{transform:translateX(-50%) scale(1.07)}
  #toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:40;background:#fff;color:#a02c53;
    padding:10px 16px;border-radius:12px;font-size:.9rem;box-shadow:0 8px 20px rgba(0,0,0,.2);display:none;max-width:90vw;text-align:center}
  .hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#b13a63;font-size:.95rem;z-index:3;opacity:.85}
</style>
</head>
<body>

<div class="float-bg" id="floatBg"></div>
<canvas id="fx"></canvas>

<div class="scene" id="scene">
  <div class="book" id="book">

    <!-- Page 3 (bottom): the message -->
    <div class="page" id="page3"><img src="images/message.jpg" alt="Birthday message" style="width:100%;height:100%;object-fit:cover"></div>

    <!-- Leaf 2: front = photos page with gift, back = blank -->
    <div class="leaf" id="leaf2">
      <div class="face front">
        <img src="images/photos.jpg" alt="Photos and gift">
        <span class="sparkle" style="left:12%;top:30%;animation-delay:.2s">✨</span>
        <span class="sparkle" style="left:58%;top:8%;animation-delay:.9s">✨</span>
        <span class="sparkle" style="left:82%;top:38%;animation-delay:1.4s">💖</span>
        <span class="sparkle" style="left:30%;top:62%;animation-delay:.5s">✨</span>
        <span class="sparkle" style="left:78%;top:90%;animation-delay:1.1s">✨</span>
        <button class="hot" id="giftBtn" aria-label="Open the gift"></button>
      </div>
      <div class="face back"><span class="h">💗</span>for you</div>
    </div>

    <!-- Leaf 1: front = cover, back = blank -->
    <div class="leaf" id="leaf1">
      <div class="face front">
        <img src="images/cover.jpg" alt="Happy Birthday cover">
        <button class="hot" id="openBtn" aria-label="Open with happiness"></button>
      </div>
      <div class="face back"><span class="h">🎂</span>made with love</div>
    </div>

  </div>
</div>

<div class="hint" id="hint">Tap “Open with happiness” 💌</div>
<button class="ctrl" id="music" title="Mute / unmute">🔊</button>
<button class="ctrl" id="replay">↺ Read again</button>
<div id="toast"></div>

<!-- 🎵 Put your song file in the same folder and name it song.mp3 -->
<audio id="song" src="song.mp3" preload="auto" loop></audio>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const song = $('song'), toast = $('toast');
  let giftOpened = false;

  /* ---------- floating emojis ---------- */
  const bits = ['💗','🎈','✨','🌸','💖','🎀','🎉'];
  for(let i=0;i<16;i++){
    const s=document.createElement('span');
    s.textContent=bits[i%bits.length];
    s.style.left=(Math.random()*96)+'%';
    s.style.fontSize=(18+Math.random()*22)+'px';
    s.style.animationDuration=(9+Math.random()*10)+'s';
    s.style.animationDelay=(-Math.random()*16)+'s';
    $('floatBg').appendChild(s);
  }

  /* ---------- confetti / hearts ---------- */
  const cv=$('fx'), ctx=cv.getContext('2d'); let parts=[], running=false;
  const cols=['#e8547f','#ffb3c8','#ffd66b','#ffffff','#ff8fab','#c9184a','#7ee0ff'];
  function size(){cv.width=innerWidth;cv.height=innerHeight} addEventListener('resize',size); size();
  function burst(n,x,y){
    x = x ?? innerWidth/2; y = y ?? innerHeight*.5;
    for(let i=0;i<n;i++){
      const heart = Math.random()<.3;
      parts.push({x,y,vx:(Math.random()-.5)*15,vy:-Math.random()*15-3,s:Math.random()*9+6,
        r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[(Math.random()*cols.length)|0],life:0,heart});
    }
    if(!running){running=true;requestAnimationFrame(loop)}
  }
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(const p of parts){
      p.vy+=.32;p.vx*=.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
      if(p.heart){ctx.font=p.s*2+'px serif';ctx.textAlign='center';ctx.fillText('💖',0,0)}
      else{ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.55)}
      ctx.restore();
    }
    parts=parts.filter(p=>p.y<cv.height+40&&p.life<300);
    if(parts.length)requestAnimationFrame(loop);else{running=false;ctx.clearRect(0,0,cv.width,cv.height)}
  }

  /* ---------- toast ---------- */
  function say(t){toast.textContent=t;toast.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>toast.style.display='none',4500)}

  /* ---------- flipping ---------- */
  function flip(leaf){
    leaf.classList.add('flipped');
  }

  // Step 1: open the cover
  $('openBtn').addEventListener('click',()=>{
    flip($('leaf1'));
    $('hint').textContent='Now tap the gift box 🎁';
    burst(140);
    setTimeout(()=>burst(80),600);
  });

  // Step 2: tap the gift -> music + turn page
  $('giftBtn').addEventListener('click',()=>{
    if(giftOpened) return; giftOpened=true;
    // play song (must happen inside this click for mobile browsers)
    song.currentTime = 0;
    const p = song.play();
    if(p && p.catch) p.catch(()=>say('Add your song as “song.mp3” in the same folder to hear the music 🎵'));
    song.addEventListener('error',()=>say('Song file not found: upload “song.mp3” next to index.html 🎵'),{once:true});
    $('music').style.display='block';
    burst(180);
    $('hint').textContent='';
    setTimeout(()=>{flip($('leaf2')); burst(120)},700);
    setTimeout(()=>{ $('replay').style.display='block'; heartRain(); },2300);
  });

  // gentle heart rain on the message page
  let rain;
  function heartRain(){
    clearInterval(rain);
    rain=setInterval(()=>burst(3,Math.random()*innerWidth,-10),900);
  }

  // Replay: close the book again (music keeps playing)
  $('replay').addEventListener('click',()=>{
    clearInterval(rain);
    $('leaf2').classList.remove('flipped');
    $('leaf1').classList.remove('flipped');
    giftOpened=false;
    $('replay').style.display='none';
    $('hint').textContent='Tap “Open with happiness” 💌';
  });

  // Music toggle
  $('music').addEventListener('click',()=>{
    if(song.paused){song.play().catch(()=>{});$('music').textContent='🔊'}
    else{song.pause();$('music').textContent='🔇'}
  });
})();
</script>
</body>
</html>
