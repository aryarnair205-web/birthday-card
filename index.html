
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Birthday Surprise ♡</title>

  <style>
    :root {
      --pink: #ef7c9d;
      --deep-pink: #d94f7b;
      --paper: #fffaf7;
      --ink: #633f4b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 24px 12px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 15%, #ffe4eb 0, transparent 34%),
        radial-gradient(ellipse at 90% 82%, #ffe9d9 0, transparent 32%),
        #fff8f5;
      font-family: Georgia, "Times New Roman", serif;
    }

    .scene {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .hint {
      margin: 0;
      text-align: center;
      font-size: clamp(13px, 2vw, 16px);
      color: #a35d73;
      letter-spacing: .04em;
    }

    /* FRONT COVER */
    .cover-wrap {
      position: relative;
      width: min(76vw, 470px);
      max-height: calc(100vh - 110px);
      aspect-ratio: 1000 / 1409;
      border-radius: 3px 9px 9px 3px;
      box-shadow: 0 18px 45px #8e52602b,
                  0 3px 9px #8e52601c;
      transform-origin: left center;
      transition:
        opacity .55s ease,
        transform .75s cubic-bezier(.2,.75,.2,1);
      overflow: hidden;
      background: white;
    }

    .cover-wrap img,
    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .cover-wrap.opening {
      opacity: 0;
      transform:
        perspective(1400px)
        rotateY(-100deg)
        translateX(-20px);
      pointer-events: none;
    }

    /* Invisible button positioned over the cover button */
    .open-button {
      position: absolute;
      left: 17.3%;
      top: 86.2%;
      width: 67.8%;
      height: 6.6%;
      border: 0;
      border-radius: 18px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .open-button:focus-visible,
    .gift-button:focus-visible {
      outline: 3px solid #b93665;
      outline-offset: 3px;
    }

    /* OPEN BOOK */
    .book {
      display: none;
      width: min(96vw, 1000px);
      perspective: 1800px;
      opacity: 0;
      transform: translateY(12px) scale(.98);
    }

    .book.show {
      display: block;
      animation: bookIn .75s .18s forwards;
    }

    .spread {
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      filter: drop-shadow(0 18px 25px #8e526026);
      transform-style: preserve-3d;
    }

    /* Book spine */
    .spread::after {
      content: "";
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 12px;
      transform: translateX(-50%);
      background: linear-gradient(
        90deg,
        #d7c9c1aa,
        #fff8f2 48%,
        #bda9a0aa
      );
      pointer-events: none;
    }

    .page {
      position: relative;
      aspect-ratio: 1000 / 1409;
      min-width: 0;
      overflow: hidden;
      background: var(--paper);
    }

    .left-page {
      border-radius: 4px 0 0 4px;
    }

    .right-page {
      border-radius: 0 4px 4px 0;
    }

    .page img {
      object-fit: fill;
    }

    /* CLICKABLE GIFT BOX */
    .gift-button {
      position: absolute;
      z-index: 4;
      left: 72.2%;
      top: 72.5%;
      width: 25.5%;
      height: 22%;
      border: 0;
      background: transparent;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .gift-button::after {
      content: "♫";
      position: absolute;
      right: 3%;
      bottom: 1%;
      width: clamp(22px, 3.4vw, 38px);
      height: clamp(22px, 3.4vw, 38px);
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: #e75d89e8;
      box-shadow: 0 3px 10px #8e526044;
      font: 20px/1 Arial, sans-serif;
      opacity: 0;
      transition: opacity .2s;
    }

    .gift-button:hover::after,
    .gift-button:focus-visible::after,
    .gift-button.playing::after {
      opacity: 1;
    }

    .gift-button.playing::after {
      content: "Ⅱ";
    }

    .music-note {
      font: 13px/1.4 Arial, sans-serif;
      color: #a35d73;
      text-align: center;
      min-height: 18px;
    }

    .restart {
      display: none;
      border: 1px solid #f0b0c3;
      color: #a84d6c;
      background: #fff;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    .restart.show {
      display: inline-block;
    }

    .restart:hover {
      background: #fff0f4;
    }

    @keyframes bookIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* MOBILE FRIENDLY */
    @media (max-width: 560px) {
      body {
        padding: 16px 4px;
      }

      .cover-wrap {
        width: min(88vw, calc((100vh - 105px) * .7097));
      }

      .book {
        width: 98vw;
      }

      .spread::after {
        width: 7px;
      }

      .gift-button::after {
        opacity: .85;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="scene">

    <p class="hint" id="hint">
      A little birthday surprise, made just for you ♡
    </p>

    <!-- FRONT COVER -->
    <section class="cover-wrap" id="cover"
             aria-label="Birthday card cover">

      <img src="cover.jpg"
           alt="Birthday cake cover with the words Happy Birthday">

      <button class="open-button"
              id="openBook"
              aria-label="Open with happiness">
      </button>

    </section>

    <!-- OPEN BOOK: PHOTOS ON LEFT, MESSAGE ON RIGHT -->
    <section class="book" id="book" aria-label="Open birthday book">

      <div class="spread">

        <!-- LEFT PAGE: PHOTOS AND GIFT -->
        <div class="page left-page">

          <img src="photos.jpg"
               alt="Birthday memories, photos, balloons and a gift box">

          <button class="gift-button"
                  id="giftButton"
                  aria-label="Click the gift box to play the birthday song"
                  title="Click the gift to play the song">
          </button>

        </div>

        <!-- RIGHT PAGE: BIRTHDAY MESSAGE -->
        <div class="page right-page">

          <img src="message.jpg"
               alt="A heartfelt birthday message decorated with pink hearts">

        </div>

      </div>

    </section>

    <div class="music-note" id="musicNote" aria-live="polite">
      Tap the gift box on the photo page for your song ♫
    </div>

    <button class="restart" id="restart">
      Close the book ↶
    </button>

    <!-- YOUR SONG -->
    <audio id="birthdaySong"
           src="song.mpeg"
           preload="auto"
           loop>
    </audio>

  </main>

  <script>
    const cover = document.getElementById("cover");
    const book = document.getElementById("book");
    const openButton = document.getElementById("openBook");
    const restart = document.getElementById("restart");
    const giftButton = document.getElementById("giftButton");
    const song = document.getElementById("birthdaySong");
    const musicNote = document.getElementById("musicNote");
    const hint = document.getElementById("hint");

    // OPEN THE BIRTHDAY BOOK
    openButton.addEventListener("click", () => {

      cover.classList.add("opening");

      hint.textContent = "A book full of memories ♡";

      window.setTimeout(() => {

        cover.style.display = "none";

        book.classList.add("show");

        restart.classList.add("show");

      }, 560);

    });

    // PLAY OR PAUSE THE SONG WHEN THE GIFT IS CLICKED
    giftButton.addEventListener("click", async () => {

      if (song.paused) {

        try {

          await song.play();

          giftButton.classList.add("playing");

          musicNote.textContent =
            "Your song is playing ♡ Tap the gift again to pause.";

        } catch (error) {

          musicNote.textContent =
            "Could not play the song. Check that song.mpeg is uploaded with index.html.";

        }

      } else {

        song.pause();

        giftButton.classList.remove("playing");

        musicNote.textContent =
          "Song paused ♡ Tap the gift to play again.";

      }

    });

    // CLOSE THE BOOK AND RETURN TO THE COVER
    restart.addEventListener("click", () => {

      song.pause();

      song.currentTime = 0;

      giftButton.classList.remove("playing");

      book.classList.remove("show");

      restart.classList.remove("show");

      cover.style.display = "block";

      requestAnimationFrame(() => {
        cover.classList.remove("opening");
      });

      hint.textContent =
        "A little birthday surprise, made just for you ♡";

      musicNote.textContent =
        "Tap the gift box on the photo page for your song ♫";

    });
  </script>

</body>
</html>
